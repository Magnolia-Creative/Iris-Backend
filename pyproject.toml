[project]
name = "my-fastapi-app"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "gunicorn==21.2.0",
  "pydantic>=2.6",
  "langchain>=0.3",
  "langchain-openai>=0.3",
  "langgraph>=0.2",
  "modal",
  "redis>=5.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.22",
  "numpy>=2.4.3",
  "certifi",
  "websockets>=12",
  "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
